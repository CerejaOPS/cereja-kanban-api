spring.application.name=kanban

# Configuracao do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/chdeal_kanban
spring.datasource.username=postgres
spring.datasource.password=12345
spring.jpa.open-in-view=false

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracao do Discord OAuth2
discord.client-id=1545882294290743388
discord.client-secret=${DISCORD_CLIENT_SECRET}
discord.redirect-uri=http://localhost:8080/api/auth/discord/callback

# Configuracao do JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000