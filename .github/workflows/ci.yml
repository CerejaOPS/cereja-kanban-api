name: Backend CI Watchdog

on:
  push:
    branches: [ "main", "rc" ]
  pull_request:
    branches: [ "main", "rc" ]

jobs:
  lint-and-architecture:
    name: STAGE 1 - Architectural Guard (ArchUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw
      - name: Verify Architecture (Clean Arch)
        run: ./mvnw test -Dtest=*ArchitectureGuardTest

  automated-tests:
    name: STAGE 2 - Automated Tests
    runs-on: ubuntu-latest
    needs: lint-and-architecture
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw
      - name: Run Unit and Integration Tests
        run: ./mvnw test

  type-check-and-compile:
    name: STAGE 3 - Compilation
    runs-on: ubuntu-latest
    needs: automated-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw
      - name: Compile Code
        run: ./mvnw compile -DskipTests

  build:
    name: STAGE 4 - Production Build
    runs-on: ubuntu-latest
    needs: type-check-and-compile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw
      - name: Build Executable Jar
        run: ./mvnw package -DskipTests
