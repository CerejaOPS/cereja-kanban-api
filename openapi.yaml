openapi: 3.0.0
info:
  title: CherDeal Kanban API
  description: API interna para o sistema de Kanban e integrações do CherDeal
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Servidor de Desenvolvimento
paths:
  /api/auth/discord:
    get:
      summary: Inicia o fluxo de autenticação com o Discord
      description: Redireciona o usuário para a página de autorização OAuth2 do Discord.
      tags:
        - Auth
      responses:
        '302':
          description: Redirecionamento HTTP para a URL do Discord.

  /api/auth/discord/callback:
    get:
      summary: Callback de autorização do Discord
      description: Endpoint chamado pelo Discord após o usuário aprovar ou negar o acesso. Recebe o código e retorna o token JWT da aplicação.
      tags:
        - Auth
      parameters:
        - in: query
          name: code
          schema:
            type: string
          required: false
          description: Código temporário gerado pelo Discord (presente em caso de sucesso).
        - in: query
          name: error
          schema:
            type: string
          required: false
          description: Erro retornado pelo Discord (ex. "access_denied" caso o usuário cancele).
      responses:
        '200':
          description: Autenticação bem-sucedida. Retorna o token JWT.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Token JWT para ser enviado no header Authorization (Bearer {token}).
        '401':
          description: Falha de autenticação (acesso negado, código inválido ou ausente).

  /api/tasks:
    get:
      summary: Lista todas as tarefas (filtradas por phase opcional)
      tags:
        - Tasks
      parameters:
        - in: query
          name: phase
          schema:
            type: string
          required: false
          description: Filtra por fase da tarefa
      responses:
        '200':
          description: Lista de tarefas retornada com sucesso
    post:
      summary: Cria uma nova tarefa
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                description:
                  type: string
                phase:
                  type: string
                  default: backlog
                assignee_discord_id:
                  type: string
                board_id:
                  type: integer
                  default: 1
      responses:
        '201':
          description: Tarefa criada com sucesso

  /api/phases:
    get:
      summary: Lista todas as fases do Kanban
      tags:
        - Phases
      responses:
        '200':
          description: Lista de fases retornada com sucesso

  /api/labels:
    get:
      summary: Lista as etiquetas (tags) disponíveis
      tags:
        - Labels
      responses:
        '200':
          description: Lista de etiquetas retornada

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT